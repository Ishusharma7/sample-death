<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>University Login</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <main class='container'>
    <section class='hero'>
      <p>UIET Kathua</p>
      <h1>Student Admission Portal Login</h1>
      <p>Login to check your admission status</p>
    </section>
    <section class='card'>
      <form action='#' method='post'>
        <div class='field'>
          <label for='student-id'>Enter Registered Email ID</label>
          <input type='email' id='student-id' name='student-id' placeholder='Email ID' required>
        </div>
        <div class='field'>
          <label for='password'>Password</label>
          <input type='password' id='password' name='password' placeholder='Enter your password' required>
        </div>
        <div class='actions'>
          <button type='submit'>Sign In</button>
        </div>
        <div class='links'>
          <a href='#'>Forgot Password?</a>
          <a href='#'>Need Help?</a>
        </div>
      </form>
    </section>
    <div class='footer'>
      Not registered? <a href='register.html'>Register Now</a>
    </div>
  </main>
</body>
</html>
