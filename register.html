<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>University Registration</title>
    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <main class='container'>
        <section class='hero'>
            <h1>UIET Kathua</h1>
            <p>Create your student account with the details below.</p>
        </section>
        <section class='card'>
            <form action='#' method='post'>
                <div class='field'>
                    <label for='full-name'>Full Name</label>
                    <input type='text' id='full-name' name='full-name' placeholder='Enter Name' required>
                </div>
                <div class='field'>
                    <label>Date of Birth</label>
                    <div class='dob'>
                        <input type='number' name='dob-day' placeholder='DD' min='1' max='31' required>
                        <input type='number' name='dob-month' placeholder='MM' min='1' max='12' required>
                        <input type='number' name='dob-year' placeholder='YYYY' min='1900' max='2024' required>
                    </div>
                </div>
                <div class='field'>
                    <label for='email'>Email Address</label>
                    <input type='email' id='email' name='email' placeholder='you@domain.com' required>
                </div>
                <div class='field'>
                    <label for='mobile'>Mobile Number</label>
                    <input type='tel' id='mobile' name='mobile' placeholder='Mobile Number' required>
                </div>
                <div class='row'>
                    <div class='field'>
                        <label for='password'>Password</label>
                        <input type='password' id='password' name='password' placeholder='Create a password' required>
                    </div>
                    <div class='field'>
                        <label for='confirm-password'>Confirm Password</label>
                        <input type='password' id='confirm-password' name='confirm-password'
                            placeholder='Confirm password' required>
                    </div>
                </div>
                <div class='actions'>
                    <button type='submit'>Register</button>
                </div>
            </form>
        </section>
        <div class='footer'>
            Already registered? <a href='index.html'>Sign in</a>.
        </div>
    </main>
</body>

</html>
